[project]
name = "ub-hrpro-hrpro"
version = "0.1.0"
description = "Official implementation of Point-Supervised Japanese Fingerspelling Localization via HR-Pro and Contrastive Learning."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib==1.4.2",
    "matplotlib==3.10.0",
    "numpy==2.2.2",
    "pandas==2.2.3",
    "protobuf==3.20.3",
    "pyyaml==6.0.2",
    "scikit-learn==1.6.1",
    "scipy==1.15.1",
    "seaborn==0.13.2",
    "tensorboard==2.19.0",
    "tensorboard-logger==0.1.0",
    "termcolor==3.0.1",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "tqdm==4.67.1",
    "wandb==0.19.6",
]

[dependency-groups]
dev = [
    "ruff>=0.12.1",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
